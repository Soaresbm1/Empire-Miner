<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#07060a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Empire Miner" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Empire Miner</title>
    <meta name="description" content="Empire Miner — jeu de minage, progression et automatisation." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="ui">
      <div id="hud" class="hidden">
        <!-- Argent, profondeur, vitesse, connexion et équipement : deux cadres sur ordinateur, un seul sur téléphone. -->
        <div class="hud-left hud-box">
          <div class="hud-tl hud-box">
            <div id="hud-money" class="money"></div>
            <div id="hud-income" class="income"></div>
            <div id="hud-market" class="market"></div>
            <div id="hud-depth" class="depth"></div>
            <div id="hud-speed" class="speed"></div>
            <div id="hud-net" class="net" data-action="invite"></div>
          </div>
          <div id="hud-equip" class="hud-bl hud-box"></div>
        </div>
        <div id="net-stall" class="hidden"></div>
        <!-- Sur téléphone, l'objectif vient ici (au centre en haut) ; sur ordinateur il reste dans la colonne de droite. -->
        <div class="hud-mid"></div>
        <div class="hud-tr">
          <div id="hud-objective" class="hud-box objective"></div>
          <div id="minimap-box" class="hud-box minimap" data-action="openMap" title="Carte de la mine (M)">
            <canvas id="minimap"></canvas>
            <div class="minimap-cap"><kbd>M</kbd> carte</div>
          </div>
          <div id="hud-track" class="hud-box track" data-action="openMap" title="Repère suivi (carte : M)"></div>
        </div>
        <div class="hud-bc">
          <div id="hud-prompt" class="prompt"></div>
          <div id="hud-build"></div>
        </div>
        <div id="hud-hints" class="hud-br"></div>
        <div id="save-indicator">Sauvegarde automatique ✓</div>
      </div>
      <div id="toasts"></div>
      <div id="tooltip"></div>
      <div id="panel-root"></div>
      <div id="menu-root"></div>
      <canvas id="menu-fx" class="hidden"></canvas>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
